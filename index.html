<!DOCTYPE html>
<html>
<head>
<title>Totally Normal Site</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* Hide cursor when prank active */
.hide-cursor {
  cursor: none;
}

/* Page sections */
.section {
  display: none;
  padding: 40px;
}

.active {
  display: block;
}

/* Secret exit zone */
#exitZone {
  position: fixed;
  bottom: 0;
  right: 0;
  width: 80px;
  height: 80px;
  z-index: 999;
}

/* Make it invisible */
#exitZone {
  background: transparent;
}
</style>
</head>

<body>

<!-- NORMAL PAGE -->
<div id="home" class="section active">
  <h1>Welcome To My Website</h1>
  <p>Click anywhere to continue.</p>
</div>

<!-- PRANK PAGE -->
<div id="prank" class="section">

<h1 style="color:red;">YOUR PC HAS THE ID10T ERROR!</h1>
<h2 style="color:red;">HOW TO FIX:</h2>
<h3>Buy 100 Bags of Cheetos, eat them all, and seek mental help.</h3>

<p style="margin-top:100px;">(System Scan Running...)</p>

</div>

<!-- REVEAL PAGE -->
<div id="reveal" class="section">
  <h1 style="color:blue;">LOL THIS WAS A PRANK XD</h1>
  <p>You can leave fullscreen now.</p>
</div>

<!-- SECRET EXIT CLICK ZONE -->
<div id="exitZone" onclick="endPrank()"></div>

<script>

let prankTimer;

// Start prank on click
document.getElementById("home").addEventListener("click", startPrank);

function startPrank() {

  // Switch pages
  document.getElementById("home").classList.remove("active");
  document.getElementById("prank").classList.add("active");

  // Fullscreen
  document.documentElement.requestFullscreen();

  // Hide cursor
  document.body.classList.add("hide-cursor");

  // Auto end after 2 minutes (120000 ms)
  prankTimer = setTimeout(endPrank, 120000);
}

function endPrank() {

  clearTimeout(prankTimer);

  // Exit fullscreen
  if (document.fullscreenElement) {
    document.exitFullscreen();
  }

  // Show reveal page
  document.getElementById("prank").classList.remove("active");
  document.getElementById("reveal").classList.add("active");

  // Restore cursor
  document.body.classList.remove("hide-cursor");
}

</script>

</body>
</html>
